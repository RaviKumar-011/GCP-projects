steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - copy-uploaded-file
      - --source=cloud_function/copy-uploaded-file
      - --function=move_file
      - --base-image=python315
      - --region=asia-south1
      - --service-account=gcs-file-validator@project-ae06767c-03a0-4e39-a32.iam.gserviceaccount.com
      - --project=project-ae06767c-03a0-4e39-a32
      - --no-allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY
