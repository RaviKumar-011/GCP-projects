steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |

      ACCESS_TOKEN=$$(gcloud auth print-access-token)

      RELEASE_ID=$$(grep -o '"releaseConfigId":[ ]*"[^"]*"' release-config.json | cut -d'"' -f4)
      GIT_BRANCH=$$(grep -o '"gitCommitish":[ ]*"[^"]*"' release-config.json | cut -d'"' -f4)

      echo "Release ID: $$RELEASE_ID"
      echo "Branch: $$GIT_BRANCH"

      curl -X PATCH \
      -H "Authorization: Bearer $$ACCESS_TOKEN" \
      -H "Content-Type: application/json" \
      -d "{
        \"gitCommitish\":\"$$GIT_BRANCH\"
      }" \
      "https://dataform.googleapis.com/v1beta1/projects/project-cb5a77af-6ec0-433b-a14/locations/us-central1/repositories/ravi-dataform-prac/releaseConfigs/$$RELEASE_ID"

options:
  logging: CLOUD_LOGGING_ONLY
