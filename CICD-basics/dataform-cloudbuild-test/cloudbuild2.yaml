steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      ACCESS_TOKEN=$$(gcloud auth print-access-token)

      curl -X POST \
      -H "Authorization: Bearer $$ACCESS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "author": {
          "name": "Ravi Kumar",
          "emailAddress": "ravipdeexam@gmail.com"
        }
      }' \
      "https://dataform.googleapis.com/v1beta1/projects/project-cb5a77af-6ec0-433b-a14/locations/us-central1/repositories/ravi-dataform-prac/workspaces/workspace-demo:pull"

options:
  logging: CLOUD_LOGGING_ONLY
